services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medplum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medplum}
      POSTGRES_DB: ${POSTGRES_DB:-medplum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medplum} -d ${POSTGRES_DB:-medplum}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-medplum}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-medplum}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  medplum-server:
    image: ${MEDPLUM_SERVER_IMAGE:-medplum/medplum-server:latest}
    restart: unless-stopped
    command: ["env"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MEDPLUM_PORT: ${MEDPLUM_PORT:-8103}
      MEDPLUM_BASE_URL: ${MEDPLUM_BASE_URL:-http://localhost:8103}
      MEDPLUM_APP_BASE_URL: ${MEDPLUM_APP_BASE_URL:-http://localhost:3000}
      MEDPLUM_DATABASE_HOST: ${MEDPLUM_DATABASE_HOST:-postgres}
      MEDPLUM_DATABASE_PORT: ${MEDPLUM_DATABASE_PORT:-5432}
      MEDPLUM_DATABASE_DBNAME: ${MEDPLUM_DATABASE_DBNAME:-medplum}
      MEDPLUM_DATABASE_USERNAME: ${MEDPLUM_DATABASE_USERNAME:-medplum}
      MEDPLUM_DATABASE_PASSWORD: ${MEDPLUM_DATABASE_PASSWORD:-medplum}
      MEDPLUM_DATABASE_SSL: ${MEDPLUM_DATABASE_SSL:-false}
      MEDPLUM_DATABASE_ISOLATION_LEVEL: ${MEDPLUM_DATABASE_ISOLATION_LEVEL:-REPEATABLE READ}
      MEDPLUM_DATABASE_STATEMENT_TIMEOUT: ${MEDPLUM_DATABASE_STATEMENT_TIMEOUT:-60000}
      MEDPLUM_REDIS_HOST: ${MEDPLUM_REDIS_HOST:-redis}
      MEDPLUM_REDIS_PORT: ${MEDPLUM_REDIS_PORT:-6379}
      MEDPLUM_REDIS_PASSWORD: ${MEDPLUM_REDIS_PASSWORD:-medplum}
      MEDPLUM_MAX_JSON_SIZE: ${MEDPLUM_MAX_JSON_SIZE:-1mb}
      MEDPLUM_ALLOWED_ORIGINS: ${MEDPLUM_ALLOWED_ORIGINS:-*}
    ports:
      - "${MEDPLUM_SERVER_PORT:-8103}:${MEDPLUM_PORT:-8103}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:${MEDPLUM_PORT:-8103}/healthcheck').then(r=>{if(!r.ok)throw 1})\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  medplum-app:
    image: ${MEDPLUM_APP_IMAGE:-medplum/medplum-app:latest}
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - "${MEDPLUM_APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  medplum-postgres-data:
